[project]
name = "mcp-servers-cli"
version = "0.1.1"
description = "Inspect, call and drive any MCP server from the command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "cli", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=4,<5",
    "cyclopts>=4",
    "rich>=14",
    "ollama>=0.6.2",
]

[project.scripts]
mcp-servers-cli = "mcp_servers_cli.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/zerotropism/mcp-servers-cli"
Issues = "https://github.com/zerotropism/mcp-servers-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anthropic>=1.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.6",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
